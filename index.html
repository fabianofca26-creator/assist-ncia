<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a2e">
<title>Assistência Técnica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e5ea; --line2:#cfd3db;
  --tx:#161a20; --tx2:#5d646f; --tx3:#8b929d;
  --ac:#1f3a2e; --ac-tx:#fff;
  --ok-bg:#e7f4ea; --ok-tx:#1d5b30;
  --wa-bg:#fdf0d9; --wa-tx:#7a5106;
  --er-bg:#fbe9e9; --er-tx:#8f2020;
  --in-bg:#e8eff8; --in-tx:#17436f;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101317; --card:#181c22; --line:#272c34; --line2:#39404a;
    --tx:#eceef2; --tx2:#a3abb7; --tx3:#767e8a;
    --ac:#cfe3d6; --ac-tx:#0f1a14;
    --ok-bg:#16301f; --ok-tx:#8fd6a4;
    --wa-bg:#33270f; --wa-tx:#f0c476;
    --er-bg:#331818; --er-tx:#f0a0a0;
    --in-bg:#152538; --in-tx:#9dc4ee;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-weight:600;margin:0}
button{font:inherit;color:inherit}
a{color:var(--in-tx)}
.app{min-height:100vh;display:grid;grid-template-columns:1fr}
aside{display:none}
.col{min-width:0;padding-bottom:78px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}
header h1{font-size:17px;line-height:1.2}
header p{margin:0;font-size:12px;color:var(--tx3)}
main{padding:0 14px}
.icobtn{background:none;border:0;padding:6px;border-radius:9px;color:var(--tx2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.icobtn:active,.icobtn:hover{background:var(--line)}
.icobtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icobtn.sync svg{color:var(--ok-tx)}
.icobtn.off svg{color:var(--tx3)}
.icobtn.err svg{color:var(--er-tx)}
.icobtn.busy svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;margin:0 6px 0 0;accent-color:var(--ac)}
.field{margin-bottom:12px}
.err{color:var(--er-tx);font-size:12px;margin:5px 0 0}
.btn{width:100%;background:var(--ac);color:var(--ac-tx);border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.btn:active,.btn:hover{opacity:.88}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--line2);font-weight:400;padding:10px}
.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.er{background:var(--er-bg);color:var(--er-tx)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg)}
.row[aria-current=true]{background:var(--in-bg)}
.row .g{flex:1;min-width:0}
.row b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{font-size:13px;white-space:nowrap;text-align:right}
.mut{color:var(--tx3)}
.tag{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:10px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok-tx)}
.tag.wa{background:var(--wa-bg);color:var(--wa-tx)}
.tag.er{background:var(--er-bg);color:var(--er-tx)}
.tag.in{background:var(--in-bg);color:var(--in-tx)}
.tag.mut{background:var(--line);color:var(--tx2)}
.note{border-radius:10px;padding:11px 12px;font-size:13px;display:flex;gap:9px;align-items:flex-start;margin-bottom:10px}
.note b{display:block;font-weight:600}
.note.ok{background:var(--ok-bg);color:var(--ok-tx)}
.note.wa{background:var(--wa-bg);color:var(--wa-tx)}
.note.er{background:var(--er-bg);color:var(--er-tx)}
.note.in{background:var(--in-bg);color:var(--in-tx)}
.chip{display:inline-block;font-size:12px;padding:6px 11px;border-radius:14px;border:1px solid var(--line2);color:var(--tx2);cursor:pointer;background:none;margin:0 6px 6px 0}
.chip[aria-pressed=true]{background:var(--in-bg);color:var(--in-tx);border-color:transparent}
.sec-t{font-size:12px;color:var(--tx2);margin:16px 0 7px;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi p{margin:0;font-size:11.5px;color:var(--tx2)}
.kpi b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi b span{font-size:13px;font-weight:400;color:var(--tx2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ac)}
.hide{display:none!important}
.dl{font-size:12px;color:var(--tx3);text-align:center;margin:14px 0 4px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fotos img,.fotos .add{width:84px;height:84px;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.fotos .add{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--tx3)}
.fotos img:not([src]){font-size:10px;color:var(--tx3);padding:6px;overflow:hidden}
.vis{border-left:3px solid var(--line2);padding:8px 12px;margin:10px 0}
.vis.feita{border-color:var(--ok-tx)}
.vis.atras{border-color:var(--er-tx)}
.vis h3{font-size:14px}
.vis p{margin:4px 0;font-size:13.5px}
.mats{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.mats td{padding:3px 6px 3px 0;border-bottom:1px solid var(--line)}
.mats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:13.5px}
dl.info dt{color:var(--tx2)}
dl.info dd{margin:0}
/* calendário */
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-h h2{flex:1;font-size:16px}
.cal-h h2::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .wd{font-size:11px;color:var(--tx3);text-align:center;padding:2px 0}
.cal .d{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:4px;cursor:pointer;text-align:left;font-size:12px;overflow:hidden;display:flex;flex-direction:column;gap:2px;color:inherit}
.cal .d.fora{opacity:.35}
.cal .d.hoje{border-color:var(--ac);border-width:2px}
.cal .d[aria-pressed=true]{background:var(--in-bg)}
.cal .d .n{font-weight:600;font-size:12px}
.cal .d .ev{display:none;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--in-bg);color:var(--in-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .ev.feita{background:var(--ok-bg);color:var(--ok-tx)}
.cal .d .ev.atras{background:var(--er-bg);color:var(--er-tx)}
.cal .d .pts{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.cal .d .pts i{width:7px;height:7px;border-radius:50%;background:var(--in-tx);display:block}
.cal .d .pts i.feita{background:var(--ok-tx)}
.cal .d .pts i.atras{background:var(--er-tx)}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.sem button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 3px;font-size:11px;cursor:pointer;text-align:left;min-height:58px;display:flex;flex-direction:column;gap:2px;color:inherit;overflow:hidden}
.sem button b{font-size:11px;font-weight:600}
.sem button b span{font-weight:400;color:var(--tx3)}
.sem button[aria-pressed=true]{border-color:var(--ac);border-width:2px;background:var(--in-bg)}
.sem button.hoje b{color:var(--in-tx)}
.sem button i{font-style:normal;font-size:10.5px;padding:1px 4px;border-radius:4px;background:var(--in-bg);color:var(--in-tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem button i.feita{background:var(--ok-bg);color:var(--ok-tx)}
.sem .livre{font-size:10.5px;color:var(--ok-tx)}
/* duas colunas */
.split{display:block}
.split .pane{min-width:0}
.split[data-show=detail] .pane.list{display:none}
.split:not([data-show=detail]) .pane.detail{display:none}
.voltar{margin-bottom:8px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.bottom button{flex:1;background:none;border:0;padding:9px 0 11px;font-size:11px;color:var(--tx3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg,aside button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current=page]{color:var(--tx);font-weight:600}
dialog{border:0;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--tx);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .dbody{padding:18px}
dialog h2{font-size:17px;margin-bottom:14px}
dialog .dacts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog .dacts .btn{width:auto;padding:10px 18px}
dialog .big{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:8px}
@media (min-width:900px){
  .app{grid-template-columns:220px 1fr}
  aside{display:flex;flex-direction:column;gap:4px;padding:18px 12px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh}
  aside .brand{padding:4px 10px 16px}
  aside .brand h1{font-size:17px;line-height:1.2}
  aside .brand p{margin:2px 0 0;font-size:12px;color:var(--tx3)}
  aside button.tab{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--tx2);cursor:pointer;text-align:left}
  aside button.tab:hover{background:var(--bg)}
  aside button.tab[aria-current=page]{background:var(--in-bg);color:var(--in-tx);font-weight:600}
  aside .btn{margin-top:auto}
  nav.bottom{display:none}
  .col{padding-bottom:30px}
  header{padding:20px 28px 12px}
  header h1{font-size:22px}
  #btnNovo{display:none}
  main{padding:0 28px 28px}
  .split{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
  .split .pane.list,.split .pane.detail{display:block!important}
  .split .pane.list{position:sticky;top:76px;max-height:calc(100vh - 90px);overflow:auto}
  .voltar{display:none}
  .cal .d{min-height:92px}
  .cal .d .ev{display:block}
  .cal .d .pts{display:none}
  .agenda{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
  .kpi b{font-size:28px}
}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><h1>Assistência<br>técnica</h1><p>pós-obra</p></div>
  <button class="tab" data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Agenda</button>
  <button class="tab" data-tab="chamados"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12h6M9 16h6"/></svg>Chamados</button>

</aside>
<div class="col">
  <header>
    <div class="t"><h1 id="hTit">Agenda</h1><p id="hSub"></p></div>
    <button class="icobtn off" id="btnDrive" aria-label="Google Drive" title="Google Drive"><svg viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9A7 7 0 0 0 4.3 12.5 3.5 3.5 0 0 0 6 19z"/></svg></button>

  </header>
  <main id="main"></main>

</div>
<nav class="bottom">
  <button data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>agenda</button>
  <button data-tab="chamados"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12h6M9 16h6"/></svg>chamados</button>
  <button data-tab="imoveis"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/></svg>imóveis</button>

</nav>
<dialog id="dlg"></dialog>

<script>
"use strict";
const KEY = "assist_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const PADRAO = () => ({
  config: {
    garantias: [
      { id: "pintura", nome: "Pintura, rejunte e vedação", anos: 1 },
      { id: "esquadrias", nome: "Esquadrias, fechaduras, louças e metais", anos: 2 },
      { id: "eletrica", nome: "Instalações elétricas", anos: 3 },
      { id: "hidraulica", nome: "Instalações hidráulicas", anos: 3 },
      { id: "imperm", nome: "Impermeabilização e infiltração", anos: 5 },
      { id: "estrutura", nome: "Estrutura", anos: 5 },
      { id: "outro", nome: "Outro", anos: 1 }
    ],
    pessoas: [{ id: "p1", nome: "Faz-tudo", padrao: true }],
    driveClientId: "",
    ultimoBackup: null
  },
  meta: { salvoEm: null },
  condominios: [], imoveis: [], chamados: [], visitas: [], fotos: []
});

let S = carregar();
function migrar(d) {
  const p = PADRAO();
  d.config = Object.assign(p.config, d.config || {});
  d.meta = d.meta || { salvoEm: null };
  for (const k of ["condominios", "imoveis", "chamados", "visitas", "fotos"]) d[k] = Array.isArray(d[k]) ? d[k] : [];
  // v1 guardava o empreendimento como texto no imóvel; vira cadastro de condomínio
  d.imoveis.forEach(i => {
    if (!i.empreendimento) { delete i.empreendimento; return; }
    let c = d.condominios.find(x => x.nome === i.empreendimento);
    if (!c) { c = { id: uid(), nome: i.empreendimento, endereco: "", entrega: "", obs: "" }; d.condominios.push(c); }
    i.condominioId = c.id; delete i.empreendimento;
  });
  d.visitas.forEach(v => { v.materiais = v.materiais || []; });
  return d;
}
function carregar() {
  try { const raw = localStorage.getItem(KEY); return raw ? migrar(JSON.parse(raw)) : PADRAO(); }
  catch (e) { return PADRAO(); }
}
function salvar() {
  S.meta.salvoEm = new Date().toISOString();
  localStorage.setItem(KEY, JSON.stringify(S));
  agendarSync();
}

// --- utilidades ---------------------------------------------------------
const num = v => { if (v == null) return NaN; const s = String(v).trim().replace(/\./g, "").replace(",", "."); return s === "" ? NaN : Number(s); };
const finito = n => n !== null && n !== undefined && n !== "" && Number.isFinite(Number(n));
const fmt = (n, d = 2) => (!finito(n) ? "—" : Number(n).toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }));
const money = n => (!finito(n) ? "—" : "R$ " + fmt(n, 2));
const hoje = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dBR = s => (s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "—");
const dias = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const addDias = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const addAnos = (s, n) => { const d = new Date(s + "T12:00:00"); d.setFullYear(d.getFullYear() + n); return iso(d); };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const wa = t => { let d = String(t || "").replace(/\D/g, ""); if (d && d.length <= 11) d = "55" + d; return "https://wa.me/" + d; };
const diaSemana = s => ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(s + "T12:00:00").getDay()];

const imovel = id => S.imoveis.find(x => x.id === id);
const chamado = id => S.chamados.find(x => x.id === id);
const visita = id => S.visitas.find(x => x.id === id);
const tipoG = id => S.config.garantias.find(x => x.id === id);
const pessoa = id => S.config.pessoas.find(x => x.id === id);
const pessoaPadrao = () => S.config.pessoas.find(p => p.padrao) || S.config.pessoas[0];
const visitasDe = cid => S.visitas.filter(v => v.chamadoId === cid).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
const fotosDe = ref => S.fotos.filter(f => f.ref === ref);
const cond = id => S.condominios.find(x => x.id === id);
const nomeCond = im => (cond((im || {}).condominioId) || {}).nome || "";
// casa sem data própria herda a do condomínio
const entregaDe = im => im ? (im.entrega || (cond(im.condominioId) || {}).entrega || "") : "";
const casasDe = cid => S.imoveis.filter(i => i.condominioId === cid).sort((a, b) => a.cliente.localeCompare(b.cliente, "pt-BR"));
const condsOrdenados = () => S.condominios.slice().sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));

const STATUS = { aberto: ["Aberto", "in"], agendado: ["Agendado", "in"], andamento: ["Em andamento", "wa"], resolvido: ["Resolvido", "ok"], fora_garantia: ["Fora de garantia", "er"], nao_procede: ["Não procede", "mut"] };
const VTIPO = { avaliacao: "Avaliação", execucao: "Execução", retorno: "Retorno" };
const CANAL = { whatsapp: "WhatsApp", telefone: "Telefone", pessoal: "Pessoalmente", outro: "Outro" };

// --- regras -------------------------------------------------------------
// Status não é guardado: sai das visitas. Só o encerramento é explícito.
function statusDe(c) {
  if (c.encerrado) return c.encerrado.status;
  const vs = visitasDe(c.id);
  if (vs.some(v => !v.feita)) return "agendado";
  if (vs.length) return "andamento";
  return "aberto";
}
const tagStatus = c => { const s = STATUS[statusDe(c)]; return `<span class="tag ${s[1]}">${s[0]}</span>`; };
function garantia(c) {
  const im = imovel(c.imovelId), g = tipoG(c.tipoId);
  const entrega = entregaDe(im);
  if (!entrega || !g) return null;
  const ate = addAnos(entrega, g.anos);
  return { ate, vencida: c.data > ate, dias: dias(c.data, ate) };
}
const tagGarantia = c => {
  const g = garantia(c);
  if (!g) return '<span class="tag mut">garantia: sem data de entrega</span>';
  return g.vencida ? `<span class="tag er">garantia venceu em ${dBR(g.ate)}</span>${c.cortesia ? ' <span class="tag wa">cortesia</span>' : ""}`
    : `<span class="tag ok">na garantia até ${dBR(g.ate)}</span>`;
};
const atrasada = v => !v.feita && v.data < hoje();
const semVisita = c => !c.encerrado && !visitasDe(c.id).some(v => !v.feita);
const abertos = () => S.chamados.filter(c => !c.encerrado);
function tituloChamado(c) { const im = imovel(c.imovelId); return (im ? im.cliente : "?") + " — " + (tipoG(c.tipoId) || { nome: "?" }).nome; }

// --- estado de tela -----------------------------------------------------
let formVisitaId = null;
let tela = "agenda", sel = null, selIm = null, selCond = null, mostrarDetalhe = false, filtroCond = "";
let mesAgenda = hoje().slice(0, 7), diaSel = hoje();
let filtro = { busca: "", status: "abertos", emp: "" }, buscaIm = "";
const main = document.getElementById("main");

function ir(t) { tela = t; mostrarDetalhe = false; render(); }
function abrirChamado(id) { tela = "chamados"; sel = id; mostrarDetalhe = true; render(); }
function abrirImovel(id) { tela = "imoveis"; selIm = id; selCond = null; mostrarDetalhe = true; render(); }

function cabecalho() {
  const tit = { agenda: "Agenda", chamados: "Chamados", imoveis: "Imóveis", painel: "Painel", ajustes: "Ajustes" }[tela];
  const n = abertos().length, atr = S.visitas.filter(atrasada).length;
  document.getElementById("hTit").textContent = tit;
  document.getElementById("hSub").textContent = n + " chamado" + (n === 1 ? "" : "s") + " em aberto" + (atr ? " · " + atr + " visita" + (atr === 1 ? "" : "s") + " atrasada" + (atr === 1 ? "" : "s") : "");
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tela ? "page" : "false"));
  const bd = document.getElementById("btnDrive");
  bd.className = "icobtn " + DRIVE.estado;
  bd.title = { off: "Conectar ao Google Drive", sync: "Sincronizado" + (DRIVE.quando ? " às " + DRIVE.quando : ""), busy: "Sincronizando…", err: "Erro: " + DRIVE.erro }[DRIVE.estado];
}
function render() {
  cabecalho();
  main.innerHTML = ({ agenda: vAgenda, chamados: vChamados, imoveis: vImoveis, painel: vPainel, ajustes: vAjustes }[tela])();
  carregarFotos();
}

// --- agenda -------------------------------------------------------------
function vAgenda() {
  const [y, m] = mesAgenda.split("-").map(Number);
  const nDias = new Date(y, m, 0).getDate();
  const ini = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const porDia = {};
  S.visitas.forEach(v => (porDia[v.data] = porDia[v.data] || []).push(v));
  const nomeMes = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  let cells = ["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map(d => `<div class="wd">${d}</div>`).join("");
  // dias do mês anterior só pra alinhar a grade
  const antes = new Date(y, m - 1, 0).getDate();
  for (let i = ini - 1; i >= 0; i--) cells += `<div class="d fora"><span class="n">${antes - i}</span></div>`;
  for (let d = 1; d <= nDias; d++) {
    const s = mesAgenda + "-" + String(d).padStart(2, "0");
    const vs = (porDia[s] || []).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
    const cls = v => v.feita ? "feita" : atrasada(v) ? "atras" : "";
    cells += `<button class="d ${s === hoje() ? "hoje" : ""}" data-dia="${s}" aria-pressed="${s === diaSel}"><span class="n">${d}</span>
      ${vs.slice(0, 3).map(v => `<span class="ev ${cls(v)}">${v.hora ? v.hora + " " : ""}${esc((imovel((chamado(v.chamadoId) || {}).imovelId) || {}).cliente || "?")}</span>`).join("")}
      ${vs.length > 3 ? `<span class="ev">+${vs.length - 3}</span>` : ""}
      <span class="pts">${vs.map(v => `<i class="${cls(v)}"></i>`).join("")}</span></button>`;
  }
  const resto = (7 - (ini + nDias) % 7) % 7;
  for (let d = 1; d <= resto; d++) cells += `<div class="d fora"><span class="n">${d}</span></div>`;

  const doDia = (porDia[diaSel] || []).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
  const atras = S.visitas.filter(atrasada).sort((a, b) => a.data.localeCompare(b.data));
  const prox = S.visitas.filter(v => !v.feita && v.data > hoje() && v.data <= addDias(hoje(), 7)).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  const semV = abertos().filter(semVisita);
  return `<div class="agenda"><div>
    <div class="cal-h">
      <button class="icobtn" data-mes="-1" aria-label="mês anterior"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2>${nomeMes}</h2>
      <button class="icobtn" data-mes="0">hoje</button>
      <button class="icobtn" data-mes="1" aria-label="próximo mês"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="cal">${cells}</div>
  </div><div>
    <p class="sec-t">${diaSel === hoje() ? "hoje" : diaSemana(diaSel) + " " + dBR(diaSel)}</p>
    ${doDia.length ? doDia.map(cardVisita).join("") : '<p class="mut" style="font-size:13px;margin:0 0 8px">Nenhuma visita nesse dia.</p>'}
    <button class="btn sec" data-act="visitaNoDia" style="margin-bottom:8px">+ Marcar visita em ${dBR(diaSel)}</button>
    ${atras.length ? '<p class="sec-t" style="color:var(--er-tx)">atrasadas</p>' + atras.map(cardVisita).join("") : ""}
    ${prox.length ? '<p class="sec-t">próximos 7 dias</p>' + prox.map(cardVisita).join("") : ""}
    ${semV.length ? '<p class="sec-t">chamados sem visita marcada</p><div class="rows">' + semV.map(rowChamado).join("") + "</div>" : ""}
  </div></div>`;
}
function cardVisita(v) {
  const c = chamado(v.chamadoId) || {}, im = imovel(c.imovelId) || {};
  const at = atrasada(v);
  return `<div class="card" style="padding:12px">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
      <b>${v.hora || "sem hora"} · ${esc(im.cliente || "?")}</b>
      <span class="tag ${v.feita ? "ok" : at ? "er" : "in"}">${v.feita ? "feita" : at ? "atrasada" : VTIPO[v.tipo] || v.tipo}</span>
    </div>
    <p style="margin:3px 0;font-size:13px;color:var(--tx2)">${diaSemana(v.data)} ${dBR(v.data)} · ${esc((tipoG(c.tipoId) || {}).nome || "")}${!v.feita ? " · " + esc((pessoa(v.pessoaId) || {}).nome || "") : ""}</p>
    <p style="margin:3px 0;font-size:13px">${esc([im.endereco, nomeCond(im)].filter(Boolean).join(" — "))}</p>
    ${im.horarios ? `<p style="margin:3px 0;font-size:12.5px;color:var(--tx2)">🕐 atende: ${esc(im.horarios)}</p>` : ""}
    <div class="acts" style="margin-top:8px">
      <button class="btn sec sm" data-act="abrirChamado" data-id="${c.id}">abrir chamado</button>
      ${!v.feita ? `<button class="btn sm" data-act="concluir" data-id="${v.id}">concluir</button>` : ""}
      ${im.telefone ? `<a class="btn sec sm" style="text-decoration:none;display:inline-block" href="${wa(im.telefone)}" target="_blank">WhatsApp</a>` : ""}
      ${!v.feita ? `<button class="btn sec sm" data-act="ics" data-id="${v.id}">📅 calendário</button>` : ""}
    </div></div>`;
}

// --- chamados -----------------------------------------------------------
function rowChamado(c) {
  const im = imovel(c.imovelId) || {}, g = garantia(c);
  const prox = visitasDe(c.id).find(v => !v.feita);
  return `<button class="row" data-act="selChamado" data-id="${c.id}" aria-current="${c.id === sel}">
    <div class="g"><b>${esc(im.cliente || "?")} <span class="mut" style="font-weight:400">· ${esc(nomeCond(im))}</span></b>
    <small>${esc((tipoG(c.tipoId) || {}).nome || "")} · aberto ${dBR(c.data)}${g && g.vencida ? " · ⚠ fora da garantia" : ""}</small></div>
    <div class="v">${tagStatus(c)}${prox ? `<small class="mut" style="display:block;font-size:11px">visita ${dBR(prox.data)}</small>` : ""}</div>
  </button>`;
}
function listaChamados() {
  const q = norm(filtro.busca);
  let l = S.chamados.filter(c => {
    if (filtro.status === "abertos" && c.encerrado) return false;
    if (filtro.status === "encerrados" && !c.encerrado) return false;
    const im = imovel(c.imovelId) || {};
    if (filtro.emp && im.condominioId !== filtro.emp) return false;
    if (q && !norm([im.cliente, im.endereco, nomeCond(im), c.descricao, (tipoG(c.tipoId) || {}).nome].join(" ")).includes(q)) return false;
    return true;
  }).sort((a, b) => b.data.localeCompare(a.data) || b.criadoEm.localeCompare(a.criadoEm));
  return l.length ? `<div class="rows">${l.map(rowChamado).join("")}</div>` : '<p class="mut" style="font-size:13px">Nenhum chamado.</p>';
}
function vChamados() {
  const c = chamado(sel);
  return `<div class="split" data-show="${mostrarDetalhe && c ? "detail" : "list"}">
    <div class="pane list">
      <div class="field"><input id="fBusca" placeholder="Buscar cliente, endereço, problema…" value="${esc(filtro.busca)}"></div>
      <div style="margin-bottom:4px">
        ${["abertos", "encerrados", "todos"].map(s => `<button class="chip" data-fst="${s}" aria-pressed="${filtro.status === s}">${s}</button>`).join("")}
      </div>
      ${S.condominios.length ? `<div class="field"><select id="fEmp"><option value="">todos os condomínios</option>${condsOrdenados().map(e => `<option value="${e.id}" ${filtro.emp === e.id ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>` : ""}
      <div id="lista">${listaChamados()}</div>
    </div>
    <div class="pane detail">${c ? detalheChamado(c) : '<p class="mut" style="font-size:13px;padding-top:20px;text-align:center">Selecione um chamado ao lado, ou crie um novo.</p>'}</div>
  </div>`;
}
function detalheChamado(c) {
  const im = imovel(c.imovelId) || {};
  const vs = visitasDe(c.id);
  const custo = vs.reduce((t, v) => t + v.materiais.reduce((s, m) => s + (finito(m.valor) ? Number(m.valor) : 0), 0), 0);
  return `<button class="icobtn voltar" data-act="voltar">‹ chamados</button>
  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div><h2 style="font-size:18px"><button class="icobtn" style="padding:0;font-size:inherit;font-weight:600" data-act="abrirImovel" data-id="${c.imovelId}">${esc(im.cliente || "?")}</button></h2>
      <p style="margin:2px 0;font-size:13px;color:var(--tx2)">${esc([im.endereco, nomeCond(im)].filter(Boolean).join(" — "))}</p></div>
      <div>${tagStatus(c)}</div>
    </div>
    <div style="margin:8px 0">${tagGarantia(c)}</div>
    <dl class="info">
      <dt>Problema</dt><dd><b>${esc((tipoG(c.tipoId) || {}).nome || "?")}</b></dd>
      <dt>Contato</dt><dd>${dBR(c.data)} · ${CANAL[c.canal] || c.canal || "—"}</dd>
      ${im.horarios ? `<dt>Atende</dt><dd>${esc(im.horarios)}</dd>` : ""}
      <dt>Descrição</dt><dd style="white-space:pre-wrap">${esc(c.descricao) || "—"}</dd>
      ${c.encerrado ? `<dt>Encerrado</dt><dd>${STATUS[c.encerrado.status][0]} em ${dBR(c.encerrado.data)}${c.encerrado.obs ? " — " + esc(c.encerrado.obs) : ""}</dd>` : ""}
      ${custo ? `<dt>Material</dt><dd>${money(custo)}</dd>` : ""}
    </dl>
    <div class="fotos">${fotosDe(c.id).map(f => `<img data-foto="${f.id}" alt="">`).join("")}<button class="add" data-act="addFoto" data-ref="${c.id}" aria-label="Adicionar foto">+</button></div>
    <div class="acts">
      ${im.telefone ? `<a class="btn sec sm" style="text-decoration:none;display:inline-block" href="${wa(im.telefone)}" target="_blank">WhatsApp</a>` : ""}
      <button class="btn sec sm" data-act="editarChamado" data-id="${c.id}">editar</button>
      ${c.encerrado ? `<button class="btn sec sm" data-act="reabrir" data-id="${c.id}">reabrir</button>` : `<button class="btn sec sm" data-act="encerrar" data-id="${c.id}">encerrar</button>`}
      <button class="btn sec sm" style="color:var(--er-tx)" data-act="excluirChamado" data-id="${c.id}">excluir</button>
    </div>
  </div>
  <p class="sec-t">visitas</p>
  ${vs.length ? vs.map(blocoVisita).join("") : '<p class="mut" style="font-size:13px;margin:0 0 10px">Nenhuma visita ainda.</p>'}
  ${!c.encerrado ? `<button class="btn" data-act="novaVisita" data-id="${c.id}">+ Agendar visita</button>` : ""}`;
}
function blocoVisita(v) {
  const at = atrasada(v);
  return `<div class="vis ${v.feita ? "feita" : at ? "atras" : ""}">
    <h3>${diaSemana(v.data)} ${dBR(v.data)}${v.hora ? " às " + v.hora : ""} · ${VTIPO[v.tipo] || v.tipo} <span class="mut" style="font-weight:400">· ${esc((pessoa(v.pessoaId) || {}).nome || "")}</span>
      ${v.feita ? `<span class="tag ${v.resolveu ? "ok" : "wa"}">${v.resolveu ? "resolveu" : "não resolveu"}</span>` : at ? '<span class="tag er">atrasada</span>' : '<span class="tag in">marcada</span>'}</h3>
    ${v.obs ? `<p class="mut">${esc(v.obs)}</p>` : ""}
    ${v.feita ? `<p style="white-space:pre-wrap">${esc(v.relato) || "<span class='mut'>sem relato</span>"}</p>` : ""}
    ${v.materiais.length ? `<table class="mats">${v.materiais.map(m => `<tr><td>${esc(m.nome)}${m.qtd ? " × " + esc(m.qtd) : ""}</td><td>${money(m.valor)}</td></tr>`).join("")}</table>` : ""}
    ${v.feita || fotosDe(v.id).length ? `<div class="fotos">${fotosDe(v.id).map(f => `<img data-foto="${f.id}" alt="">`).join("")}<button class="add" data-act="addFoto" data-ref="${v.id}" aria-label="Adicionar foto">+</button></div>` : ""}
    <div class="acts" style="margin-top:6px">
      ${!v.feita ? `<button class="btn sm" data-act="concluir" data-id="${v.id}">concluir visita</button><button class="btn sec sm" data-act="ics" data-id="${v.id}">📅 calendário</button>` : ""}
      <button class="btn sec sm" data-act="editarVisita" data-id="${v.id}">editar</button>
      <button class="btn sec sm" style="color:var(--er-tx)" data-act="excluirVisita" data-id="${v.id}">excluir</button>
    </div></div>`;
}

// --- imóveis e condomínios ---------------------------------------------
function listaImoveis() {
  const q = norm(buscaIm);
  const l = S.imoveis.filter(i => (!filtroCond || i.condominioId === filtroCond) && (!q || norm([i.cliente, i.endereco, nomeCond(i), i.telefone].join(" ")).includes(q)))
    .sort((a, b) => a.cliente.localeCompare(b.cliente, "pt-BR"));
  return l.length ? `<div class="rows">${l.map(rowImovel).join("")}</div>` : '<p class="mut" style="font-size:13px">Nenhuma casa.</p>';
}
function rowImovel(i) {
  const n = S.chamados.filter(c => c.imovelId === i.id && !c.encerrado).length;
  return `<button class="row" data-act="selImovel" data-id="${i.id}" aria-current="${i.id === selIm && !selCond}">
    <div class="g"><b>${esc(i.cliente)}</b><small>${esc([i.endereco, nomeCond(i)].filter(Boolean).join(" — "))}</small></div>
    <div class="v">${n ? `<span class="tag in">${n} aberto${n > 1 ? "s" : ""}</span>` : ""}</div></button>`;
}
function rowCond(c) {
  const casas = casasDe(c.id), ab = S.chamados.filter(x => !x.encerrado && casas.some(i => i.id === x.imovelId)).length;
  return `<button class="row" data-act="selCond" data-id="${c.id}" aria-current="${c.id === selCond}">
    <div class="g"><b>${esc(c.nome)}</b><small>${casas.length} casa${casas.length === 1 ? "" : "s"}${c.entrega ? " · entrega " + dBR(c.entrega) : ""}</small></div>
    <div class="v">${ab ? `<span class="tag in">${ab} aberto${ab > 1 ? "s" : ""}</span>` : ""}</div></button>`;
}
function vImoveis() {
  const im = imovel(selIm), cd = cond(selCond);
  const detalhe = cd ? detalheCond(cd) : im ? detalheImovel(im) : '<p class="mut" style="font-size:13px;padding-top:20px;text-align:center">Selecione um condomínio ou uma casa ao lado.</p>';
  return `<div class="split" data-show="${mostrarDetalhe && (im || cd) ? "detail" : "list"}">
    <div class="pane list">
      <p class="sec-t" style="margin-top:0">condomínios</p>
      ${S.condominios.length ? `<div class="rows" style="margin-bottom:8px">${condsOrdenados().map(rowCond).join("")}</div>` : ""}
      <button class="btn sec sm" data-act="novoCond" style="margin-bottom:6px">+ Novo condomínio</button>
      <p class="sec-t">casas</p>
      <div class="field"><input id="fBuscaIm" placeholder="Buscar cliente, endereço…" value="${esc(buscaIm)}"></div>
      ${S.condominios.length ? `<div class="field"><select id="fCond"><option value="">todos os condomínios</option>${condsOrdenados().map(e => `<option value="${e.id}" ${filtroCond === e.id ? "selected" : ""}>${esc(e.nome)}</option>`).join("")}</select></div>` : ""}
      <button class="btn sec sm" data-act="novoImovel" style="margin-bottom:10px">+ Nova casa</button>
      <div id="listaIm">${listaImoveis()}</div>
    </div>
    <div class="pane detail">${detalhe}</div>
  </div>`;
}
function detalheImovel(im) {
  const cs = S.chamados.filter(c => c.imovelId === im.id).sort((a, b) => b.data.localeCompare(a.data));
  const entrega = entregaDe(im), cd = cond(im.condominioId);
  return `<button class="icobtn voltar" data-act="voltar">‹ imóveis</button>
  <div class="card">
    <h2 style="font-size:18px">${esc(im.cliente)}</h2>
    <dl class="info">
      <dt>Telefone</dt><dd>${im.telefone ? `${esc(im.telefone)} · <a href="${wa(im.telefone)}" target="_blank">WhatsApp</a>` : "—"}</dd>
      <dt>Endereço</dt><dd>${esc(im.endereco) || "—"}</dd>

// estatísticas do condomínio: onde o vício construtivo aparece, casa por casa
function statsCond(cid) {
  const casas = casasDe(cid), ids = new Set(casas.map(i => i.id));
  const cs = S.chamados.filter(c => ids.has(c.imovelId) && !(c.encerrado && c.encerrado.status === "nao_procede"));
  const tipos = {}; cs.forEach(c => { const t = (tipoG(c.tipoId) || {}).nome || "?"; tipos[t] = (tipos[t] || 0) + 1; });
  const porCasa = casas.map(i => ({ im: i, n: cs.filter(c => c.imovelId === i.id).length, ab: cs.filter(c => c.imovelId === i.id && !c.encerrado).length }));
  return { casas, total: cs.length, abertos: cs.filter(c => !c.encerrado).length, comChamado: porCasa.filter(x => x.n).length,
    tipos: Object.entries(tipos).sort((a, b) => b[1] - a[1]), ranking: porCasa.filter(x => x.n).sort((a, b) => b.n - a.n) };
}

// --- painel -------------------------------------------------------------
function vPainel() {
  const ab = abertos(), atr = S.visitas.filter(atrasada).length;
  const prox = S.visitas.filter(v => !v.feita && v.data >= hoje() && v.data <= addDias(hoje(), 7)).length;
  const res = S.chamados.filter(c => c.encerrado && c.encerrado.status === "resolvido");
  const medio = res.length ? res.reduce((t, c) => t + dias(c.data, c.encerrado.data), 0) / res.length : NaN;
  const custo = S.visitas.reduce((t, v) => t + v.materiais.reduce((s, m) => s + (finito(m.valor) ? Number(m.valor) : 0), 0), 0);
  // problemas por condomínio × tipo — é aqui que vício construtivo aparece
  const porEmp = {};
  S.chamados.forEach(c => {
    if (c.encerrado && c.encerrado.status === "nao_procede") return;
    const e = nomeCond(imovel(c.imovelId)) || "(sem condomínio)";
    const t = (tipoG(c.tipoId) || {}).nome || "?";
    porEmp[e] = porEmp[e] || { n: 0, tipos: {}, ims: new Set() };
    porEmp[e].n++; porEmp[e].ims.add(c.imovelId); porEmp[e].tipos[t] = (porEmp[e].tipos[t] || 0) + 1;
  });
  const emps = Object.entries(porEmp).sort((a, b) => b[1].n - a[1].n);
  const max = Math.max(1, ...emps.flatMap(([, d]) => Object.values(d.tipos)));
  return `<div class="kpis">
    <div class="kpi"><p>chamados em aberto</p><b>${ab.length}</b></div>
    <div class="kpi"><p>visitas próximos 7 dias</p><b>${prox}</b></div>
    <div class="kpi"><p>visitas atrasadas</p><b style="${atr ? "color:var(--er-tx)" : ""}">${atr}</b></div>
    <div class="kpi"><p>tempo médio p/ resolver</p><b>${finito(medio) ? Math.round(medio) : "—"} <span>dias</span></b></div>
    <div class="kpi"><p>material lançado</p><b style="font-size:20px">${money(custo)}</b></div>
    <div class="kpi"><p>resolvidos</p><b>${res.length} <span>de ${S.chamados.length}</span></b></div>
  </div>
  <p class="sec-t">problemas por condomínio</p>
  ${emps.length ? emps.map(([e, d]) => `<div class="card"><b>${esc(e)}</b> <span class="mut">· ${d.n} chamado${d.n > 1 ? "s" : ""} · ${d.ims.size} casa${d.ims.size > 1 ? "s" : ""}</span>
    ${Object.entries(d.tipos).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div style="font-size:13px;margin-top:8px;display:flex;justify-content:space-between"><span>${esc(t)}</span><b>${n}</b></div><div class="bar"><i style="width:${n / max * 100}%"></i></div>`).join("")}
  </div>`).join("") : '<p class="mut" style="font-size:13px">Sem chamados ainda.</p>'}`;
}

// --- fotos: reduzidas, guardadas no IndexedDB (localStorage trava em 5 MB) --
const idb = {
  db: null,
  abrir() { return new Promise((res, rej) => { const r = indexedDB.open("assist", 1); r.onupgradeneeded = () => r.result.createObjectStore("fotos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async op(modo, fn) { const db = this.db || (this.db = await this.abrir()); return new Promise((res, rej) => { const rq = fn(db.transaction("fotos", modo).objectStore("fotos")); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
  get(id) { return this.op("readonly", s => s.get(id)); },
  put(id, b) { return this.op("readwrite", s => s.put(b, id)); },
  del(id) { return this.op("readwrite", s => s.delete(id)); }
};
function comprimir(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(img.src); res(b); }, "image/jpeg", 0.8);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}
async function guardarFotos(files, ref) {
  for (const f of files) {
    const b = await comprimir(f); if (!b) continue;
    const id = uid();
    await idb.put(id, b);
    S.fotos.push({ id, ref, criadoEm: new Date().toISOString(), driveId: null });
  }
  salvar();
}
const urlFoto = {};
async function carregarFotos() {
  for (const img of document.querySelectorAll("img[data-foto]:not([src])")) {
    const id = img.dataset.foto;
    if (!urlFoto[id]) {
      let b = await idb.get(id).catch(() => null);
      if (!b) {
        const f = S.fotos.find(x => x.id === id);
        if (f && f.driveId && tokenValido()) {
          try { b = await (await dapi("files/" + f.driveId + "?alt=media")).blob(); await idb.put(id, b); } catch (e) { }
        }
      }
      if (b) urlFoto[id] = URL.createObjectURL(b);
    }
    if (urlFoto[id]) img.src = urlFoto[id];
    else img.alt = tokenValido() ? "foto não encontrada" : "foto na nuvem — conecte o Drive";
  }
}
async function excluirFoto(id) {
  const f = S.fotos.find(x => x.id === id);
  S.fotos = S.fotos.filter(x => x.id !== id);
  await idb.del(id).catch(() => { });
  delete urlFoto[id];
  salvar();
  if (f && f.driveId && tokenValido()) dapi("files/" + f.driveId, { method: "DELETE" }).catch(() => { });
}

// --- google drive -------------------------------------------------------
// ponytail: última versão ganha, sem mesclagem por registro. Usuário único;
// se um dia editar nos dois aparelhos sem sincronizar no meio, perde a mais
// antiga. Mitigação: sincroniza ao abrir e 3 s depois de cada alteração.
const DRIVE = { estado: "off", erro: "", quando: null, timer: null };
const SCOPE = "https://www.googleapis.com/auth/drive.file";
function tokenValido() {
  try { const t = JSON.parse(sessionStorage.getItem("assist_tok") || "null"); return t && t.exp > Date.now() + 60000 ? t.tok : null; } catch (e) { return null; }
}
function conectar() {
  return new Promise((res, rej) => {
    if (!S.config.driveClientId) return rej(new Error("informe o Client ID nos ajustes"));
    if (!window.google || !google.accounts) return rej(new Error("biblioteca do Google não carregou (sem internet?)"));
    google.accounts.oauth2.initTokenClient({
      client_id: S.config.driveClientId, scope: SCOPE,
      callback: r => {
        if (r.error) return rej(new Error(r.error));
        sessionStorage.setItem("assist_tok", JSON.stringify({ tok: r.access_token, exp: Date.now() + r.expires_in * 1000 }));
        res(r.access_token);
      },
      error_callback: e => rej(new Error(e.type === "popup_closed" ? "janela fechada" : e.type || "erro"))
    }).requestAccessToken({ prompt: "" });
  });
}
async function dapi(path, opts = {}, upload = false) {
  const tok = tokenValido(); if (!tok) throw new Error("não conectado");
  const r = await fetch((upload ? "https://www.googleapis.com/upload/drive/v3/" : "https://www.googleapis.com/drive/v3/") + path,
    Object.assign({}, opts, { headers: Object.assign({ Authorization: "Bearer " + tok }, opts.headers || {}) }));
  if (r.status === 401) { sessionStorage.removeItem("assist_tok"); throw new Error("sessão expirou, conecte de novo"); }
  if (!r.ok) {
    // o Google explica o motivo no corpo (API desativada, cota, escopo…)
    let msg = ""; try { msg = (await r.json()).error.message; } catch (e) { }
    throw new Error("Drive respondeu " + r.status + (msg ? ": " + msg : ""));
  }
  return r;
}
const dBuscar = async (nome, pasta) => {
  const q = `name='${nome}' and trashed=false` + (pasta ? ` and '${pasta}' in parents` : "");
  return (await (await dapi("files?q=" + encodeURIComponent(q) + "&fields=files(id,modifiedTime)")).json()).files[0] || null;
};
async function dCriar(nome, blob, pasta, mime) {
  const meta = { name: nome, parents: pasta ? [pasta] : [] };
  if (!blob) meta.mimeType = "application/vnd.google-apps.folder";
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  if (blob) fd.append("file", new Blob([blob], { type: mime }));
  const r = await dapi(blob ? "files?uploadType=multipart&fields=id" : "files?fields=id", { method: "POST", body: blob ? fd : JSON.stringify(meta), headers: blob ? {} : { "Content-Type": "application/json" } }, !!blob);
  return (await r.json()).id;
}
const dAtualizar = (id, blob, mime) => dapi("files/" + id + "?uploadType=media", { method: "PATCH", body: blob, headers: { "Content-Type": mime } }, true);
async function pastaDrive() {
  const p = await dBuscar("Assistência Técnica");
  return p ? p.id : dCriar("Assistência Técnica", null);
}
async function sincronizar(interativo) {
  if (DRIVE.estado === "busy") return;
  let mudou = false;
  try {
    if (!tokenValido()) { if (!interativo) return; await conectar(); }
    DRIVE.estado = "busy"; cabecalho();
    const pasta = await pastaDrive();
    const arq = await dBuscar("assistencia.json", pasta);
    let subir = !arq;
    if (arq) {
      const remoto = migrar(JSON.parse(await (await dapi("files/" + arq.id + "?alt=media")).text()));
      const rs = remoto.meta.salvoEm || "", ls = S.meta.salvoEm || "";
      if (rs > ls) { remoto.config.driveClientId = remoto.config.driveClientId || S.config.driveClientId; S = remoto; localStorage.setItem(KEY, JSON.stringify(S)); mudou = true; }
      else if (ls > rs) subir = true;
    }
    for (const f of S.fotos.filter(f => !f.driveId)) {
      const b = await idb.get(f.id).catch(() => null); if (!b) continue;
      f.driveId = await dCriar(f.id + ".jpg", b, pasta, "image/jpeg");
      subir = true; mudou = true;
    }
    if (subir) {
      S.meta.salvoEm = S.meta.salvoEm || new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(S));
      const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
      if (arq) await dAtualizar(arq.id, blob, "application/json"); else await dCriar("assistencia.json", blob, pasta, "application/json");
    }
    DRIVE.estado = "sync"; DRIVE.quando = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  } catch (e) {
    DRIVE.estado = tokenValido() ? "err" : "off"; DRIVE.erro = e.message;
    if (interativo) alert("Não sincronizou: " + e.message);
  }
  if (mudou || tela === "ajustes") render(); else cabecalho();
}
function agendarSync() {
  if (!tokenValido()) return;
  clearTimeout(DRIVE.timer);
  DRIVE.timer = setTimeout(() => sincronizar(false), 3000);
}

// --- calendário do celular (.ics) ---------------------------------------
function baixar(nome, conteudo, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function ics(v) {
  const c = chamado(v.chamadoId) || {}, im = imovel(c.imovelId) || {};
  const h = (v.hora || "08:00").replace(":", "");
  const ini = v.data.replace(/-/g, "") + "T" + h + "00";
  const fim = v.data.replace(/-/g, "") + "T" + String(Number(h.slice(0, 2)) + 1).padStart(2, "0") + h.slice(2) + "00";
  const t = s => String(s || "").replace(/[\\;,]/g, "\\$&").replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//assistencia//PT", "BEGIN:VEVENT", "UID:" + v.id + "@assistencia",
    "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z", "DTSTART:" + ini, "DTEND:" + fim,
    "SUMMARY:" + t("Visita: " + (im.cliente || "") + " — " + ((tipoG(c.tipoId) || {}).nome || "")),
    "LOCATION:" + t([im.endereco, nomeCond(im)].filter(Boolean).join(", ")),
    "DESCRIPTION:" + t((VTIPO[v.tipo] || "") + "\n" + (c.descricao || "") + (im.telefone ? "\nTel: " + im.telefone : "") + (v.obs ? "\n" + v.obs : "")),
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}

    else { const [y, m] = mesAgenda.split("-").map(Number); const d = new Date(y, m - 1 + Number(t.dataset.mes), 1); mesAgenda = iso(d).slice(0, 7); }
    return render();
  }
  if (t.dataset.fst) { filtro.status = t.dataset.fst; return render(); }
  if (t.dataset.diaform) { const f = dlg.querySelector("form"); f.data.value = t.dataset.diaform; document.getElementById("semana").innerHTML = semanaForm(t.dataset.diaform, formVisitaId); return; }
  acao(t.dataset.act, t.dataset.id, t);
});
function acao(a, id, el) {
  const c = chamado(id), v = visita(id), im = imovel(id);
  switch (a) {
    case "voltar": mostrarDetalhe = false; return render();
    case "fecharDlg": return dlg.close();
    case "novoChamado": return formChamado(null, tela === "imoveis" && mostrarDetalhe ? selIm : null);
    case "novoChamadoIm": return formChamado(null, id);
    case "editarChamado": return formChamado(c);
    case "selChamado": if (tela !== "chamados") return abrirChamado(id); sel = id; mostrarDetalhe = true; return render();
    case "abrirChamado": return abrirChamado(id);
    case "abrirImovel": return abrirImovel(id);
    case "selImovel": if (tela !== "imoveis") return abrirImovel(id); selIm = id; selCond = null; mostrarDetalhe = true; return render();
    case "selCond": tela = "imoveis"; selCond = id; selIm = null; mostrarDetalhe = true; return render();
    case "novoCond": return formCond();
    case "editarCond": return formCond(cond(id));
    case "novaCasaCond": return formImovel(null, null, id);
    case "condNoForm": {
      const f = dlg.querySelector("form"), guardado = f ? Object.fromEntries(new FormData(f).entries()) : {};
      dlg.close();
      return formCond(null, novo => formImovel(Object.assign({}, guardado, { id: undefined }), null, novo.id));
    }
    case "excluirCond":
      if (casasDe(id).length) return alert("Esse condomínio ainda tem casas. Mova ou exclua as casas antes.");
      if (!confirm("Excluir o condomínio?")) return;
      S.condominios = S.condominios.filter(x => x.id !== id); selCond = null; mostrarDetalhe = false; salvar(); return render();
    case "novoImovel": return formImovel(null, null, filtroCond || selCond);
    case "editarImovel": return formImovel(im);
    case "imovelNoForm": {
      const f = dlg.querySelector("form"), guardado = f ? Object.fromEntries(new FormData(f).entries()) : {};
      dlg.close();
      return formImovel(null, novo => { formChamado(Object.assign({}, guardado, { id: undefined, cortesia: !!guardado.cortesia }), novo.id); });
    }
    case "excluirImovel": {
      const n = S.chamados.filter(x => x.imovelId === id).length;
      if (!confirm("Excluir o imóvel" + (n ? " e seus " + n + " chamados" : "") + "?")) return;
      const cs = S.chamados.filter(x => x.imovelId === id).map(x => x.id);
      S.chamados = S.chamados.filter(x => x.imovelId !== id);
      S.visitas.filter(x => cs.includes(x.chamadoId)).forEach(x => fotosDe(x.id).forEach(f => excluirFoto(f.id)));
      cs.forEach(x => fotosDe(x).forEach(f => excluirFoto(f.id)));
      S.visitas = S.visitas.filter(x => !cs.includes(x.chamadoId));
      S.imoveis = S.imoveis.filter(x => x.id !== id);
      selIm = null; mostrarDetalhe = false; salvar(); return render();
    }
    case "excluirChamado": {
      if (!confirm("Excluir o chamado e suas visitas?")) return;
      visitasDe(id).forEach(x => fotosDe(x.id).forEach(f => excluirFoto(f.id)));
      fotosDe(id).forEach(f => excluirFoto(f.id));
      S.visitas = S.visitas.filter(x => x.chamadoId !== id);
      S.chamados = S.chamados.filter(x => x.id !== id);
      sel = null; mostrarDetalhe = false; salvar(); return render();
    }
    case "encerrar": return formEncerrar(c);
    case "reabrir": c.encerrado = null; salvar(); return render();
    case "novaVisita": return formVisita(null, id);
    case "visitaNoDia": if (!abertos().length) return alert("Não há chamado em aberto pra marcar visita."); return formVisita(null, null, diaSel);
    case "editarVisita": return formVisita(v, v.chamadoId);
    case "concluir": return formConcluir(v);
    case "excluirVisita":
      if (!confirm("Excluir essa visita?")) return;
      fotosDe(id).forEach(f => excluirFoto(f.id));
      S.visitas = S.visitas.filter(x => x.id !== id); salvar(); return render();
    case "ics": return baixar("visita-" + v.data + ".ics", ics(v), "text/calendar");
    case "addFoto": fotoRef = el.dataset.ref; return document.getElementById("fileFoto").click();
    case "verFoto": return verFoto(id);
    case "rmFoto": if (!confirm("Excluir a foto?")) return; dlg.close(); return excluirFoto(id).then(render);
    case "addMat": return document.getElementById("mats").insertAdjacentHTML("beforeend", linhaMat());
    case "addGar": lerAjustes(); S.config.garantias.push({ id: uid(), nome: "Novo tipo", anos: 1 }); salvar(); return render();
    case "rmGar": if (S.chamados.some(x => x.tipoId === id)) return alert("Tem chamado usando esse tipo."); lerAjustes(); S.config.garantias = S.config.garantias.filter(g => g.id !== id); salvar(); return render();
    case "addPessoa": lerAjustes(); S.config.pessoas.push({ id: uid(), nome: "", padrao: !S.config.pessoas.length }); salvar(); return render();
    case "rmPessoa": if (S.config.pessoas.length === 1) return alert("Precisa ter pelo menos uma pessoa."); lerAjustes(); S.config.pessoas = S.config.pessoas.filter(p => p.id !== id); if (!S.config.pessoas.some(p => p.padrao)) S.config.pessoas[0].padrao = true; salvar(); return render();
    case "salvarCfg": lerAjustes(); salvar(); render(); return alert("Ajustes salvos.");
    case "sync": lerAjustes(); salvar(); return sincronizar(true);
    case "exportar": S.config.ultimoBackup = hoje(); salvar(); baixar("assistencia-" + hoje() + ".json", JSON.stringify(S, null, 1), "application/json"); return render();
    case "importar": return document.getElementById("fileImp").click();
  }
}
